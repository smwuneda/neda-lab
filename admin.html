<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEDA Lab News Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14286f;--navy2:#081746;--ink:#20242a;--muted:#68707d;--line:#e1e6ef;--soft:#f5f7fb;--danger:#a82b2b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:var(--ink);background:var(--soft);line-height:1.6}
button,input,textarea{font:inherit}
.top{background:var(--navy2);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-family:"Source Serif 4",serif;font-size:20px}.user{display:flex;align-items:center;gap:10px;font-size:12px}.user img{width:34px;height:34px;border-radius:50%;background:#fff}.user button,.login button{border:0;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}.user button{background:#fff;color:var(--navy2)}
.wrap{max-width:1240px;margin:34px auto;padding:0 20px}
.login{max-width:520px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;text-align:center;box-shadow:0 18px 55px rgba(8,23,70,.10)}.login h1,.panel h2,.modal-card h3{font-family:"Source Serif 4",serif;color:var(--navy2)}.login h1{font-size:30px;margin:0 0 9px}.login p{color:var(--muted)}.login button{background:var(--navy);color:#fff;margin-top:10px;padding:12px 18px}
.grid{display:grid;grid-template-columns:420px 1fr;gap:24px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 36px rgba(8,23,70,.06)}.panel h2{margin:0 0 18px;font-size:24px}
.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;font-weight:700;color:var(--navy2)}.field input,.field textarea,.field select{width:100%;border:1px solid #d4dae6;border-radius:10px;padding:10px 11px;background:#fff}.field textarea{min-height:150px;resize:vertical}
.helper{font-size:11px;color:var(--muted)}
.preview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 14px}.preview-item{aspect-ratio:1/1;background:#eef2f8;border-radius:12px;overflow:hidden;border:1px solid #dde4f0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}.preview-item img{width:100%;height:100%;object-fit:cover}.preview-empty{width:100%;min-height:150px;background:#eef2f8;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;margin:10px 0 14px;border:1px dashed #d7dfec}
.actions{display:flex;gap:8px;flex-wrap:wrap}.primary,.secondary,.danger{border:0;border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#edf0f6;color:var(--navy2)}.danger{background:#fff0f0;color:var(--danger)}button:disabled{opacity:.5;cursor:not-allowed}.status{font-size:12px;color:var(--muted);margin-top:12px;min-height:20px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.post{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}.post:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(8,23,70,.08)}.post-media{background:#eef2f8;aspect-ratio:4/3;overflow:hidden}.post-media img{width:100%;height:100%;object-fit:cover}.post-copy{padding:16px 18px 18px}.post-copy h3{margin:0 0 6px;color:var(--navy2);font-size:18px;line-height:1.35}.post-date{font-size:12px;color:var(--navy);font-weight:700}.post-copy p{font-size:13px;color:var(--muted);white-space:pre-line;margin:9px 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.post-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}.post-count{font-size:12px;color:var(--muted)}.post-actions{display:flex;gap:7px}.post-actions button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:44px 12px;border:1px dashed #ccd4e2;border-radius:14px}
.modal{position:fixed;inset:0;background:rgba(8,23,70,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}.modal.open{display:flex}.modal-card{width:min(860px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;box-shadow:0 28px 80px rgba(8,23,70,.26)}.modal-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.modal-card h3{font-size:28px;margin:0 0 6px}.modal-close{border:0;background:#eef2f8;color:var(--navy2);border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}.modal-date{font-size:12px;font-weight:700;color:var(--navy)}.modal-desc{white-space:pre-line;color:var(--ink);font-size:15px;margin:16px 0 18px}.modal-gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.modal-gallery img{width:100%;border-radius:14px;border:1px solid #dde4f0;background:#eef2f8}.modal-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
[hidden]{display:none!important}
.modal-gallery{display:block!important;position:relative;background:#eef2f8;border-radius:16px;overflow:hidden;min-height:320px}.modal-slide{display:none;align-items:center;justify-content:center;min-height:320px}.modal-slide.active{display:flex}.modal-slide img{display:block;max-width:100%;max-height:70vh;width:auto;height:auto;border:0;border-radius:0;background:transparent}.modal-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:4;width:44px;height:44px;border:0;border-radius:999px;background:rgba(8,23,70,.76);color:#fff;font-size:26px;cursor:pointer}.modal-arrow.prev{left:12px}.modal-arrow.next{right:12px}.modal-counter{position:absolute;right:14px;bottom:12px;background:rgba(8,23,70,.72);color:#fff;border-radius:999px;padding:5px 10px;font-size:11px;font-weight:700}
@media(max-width:920px){.grid{grid-template-columns:1fr}.posts{grid-template-columns:1fr 1fr}.modal-gallery{grid-template-columns:1fr}.top{padding:14px 16px}.wrap{margin-top:22px}}
@media(max-width:620px){.posts{grid-template-columns:1fr}.preview-grid{grid-template-columns:repeat(2,1fr)}}
.login-persist-note{margin:10px 0 0;color:#68707d;font-size:12px;text-align:center}
</style>
<script src="admin-config.js"></script>
</head>
<body>
<header class="top"><div class="brand">SMWU NEDA · News Admin</div><div class="user" id="userBox" hidden><img id="userPhoto" alt=""><span id="userEmail"></span><button id="logoutBtn">로그아웃</button></div></header>
<main class="wrap">
<section class="login" id="loginPanel"><h1>NEDA Lab 관리자</h1><p>허용된 Google 계정으로 로그인한 뒤 소식을 작성·수정·삭제할 수 있습니다.</p><button id="loginBtn">Google 계정으로 로그인</button><p class="login-persist-note">로그인 상태는 새로고침해도 유지됩니다.</p><div class="status" id="loginStatus"></div></section>
<section class="grid" id="adminPanel" hidden>
<div class="panel">
<h2 id="formHeading">새 소식 작성</h2>
<form id="postForm">
<input id="postId" type="hidden">
<div class="field">
<label for="postFiles">사진 업로드</label>
<input id="postFiles" type="file" accept="image/jpeg,image/png,image/webp" multiple>
<div class="helper">한 번에 최대 30장까지 업로드할 수 있습니다. 수정 시 새 사진을 고르면 기존 사진 전체가 새 사진으로 교체됩니다.</div>
<div class="preview-empty" id="previewEmpty">사진을 선택하세요</div>
<div class="preview-grid" id="previewGrid" hidden></div>
</div>
<div class="field"><label for="postCategory">카테고리</label><select id="postCategory" required><option value="Announcements">Announcements</option><option value="Awards">Awards</option><option value="Celebrations">Celebrations</option><option value="Events" selected>Events</option><option value="Media">Media</option><option value="Presentations">Presentations</option></select></div>
<div class="field"><label for="postTitle">게시글 제목</label><input id="postTitle" maxlength="120" required placeholder="목록과 상세 화면에 표시될 제목"></div>
<div class="field"><label for="postDate">날짜</label><input id="postDate" type="date"></div>
<div class="field"><label for="postDescription">게시글 내용</label><textarea id="postDescription" maxlength="5000" required placeholder="제목과 별도로 본문 내용을 입력하세요"></textarea></div>
<div class="actions"><button class="primary" id="submitBtn" type="submit">게시하기</button><button class="secondary" id="cancelEditBtn" type="button" hidden>수정 취소</button></div>
<div class="status" id="formStatus"></div>
</form>
</div>
<div class="panel"><h2>게시된 소식</h2><div class="posts" id="posts"></div><div class="empty" id="empty">아직 게시된 소식이 없습니다.</div></div>
</section>
</main>
<div class="modal" id="detailModal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head"><div><h3 id="detailTitle">게시물</h3><div class="modal-date" id="detailDate"></div></div><button class="modal-close" id="detailClose" type="button">닫기</button></div>
    <div class="modal-desc" id="detailDesc"></div>
    <div class="modal-gallery" id="detailGallery"></div>
    <div class="modal-toolbar"><button class="secondary" id="detailEdit" type="button">수정</button><button class="danger" id="detailDelete" type="button">삭제</button></div>
  </div>
</div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,setPersistence,browserLocalPersistence} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
const cfg=window.NEDA_ADMIN_CONFIG||{};
const app=initializeApp(cfg.firebase||{});
const auth=getAuth(app);
const authPersistenceReady=setPersistence(auth,browserLocalPersistence).catch(err=>{console.error('로그인 유지 설정 실패:',err);});
const provider=new GoogleAuthProvider();
provider.setCustomParameters({prompt:'select_account'});
const $=id=>document.getElementById(id);
let posts=[]; let firebaseIdToken=''; let activePostId=''; let detailSlideIndex=0;
const endpoint=()=>String(cfg.appsScriptUrl||'').trim();
const allowed=email=>(cfg.allowedEmails||[]).map(v=>String(v).toLowerCase()).includes(String(email||'').toLowerCase());
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const short=v=>{const s=String(v||'').trim().replace(/\s+/g,' '); return s.length>120?s.slice(0,120)+'…':s;};
const fmtDate=v=>{const s=String(v||''); const m=s.match(/^(\d{4}-\d{2}-\d{2})/); return m?m[1]:s;};
function getFiles(){return Array.from($('postFiles').files||[]).slice(0,30);} 
function setPreview(files){ const grid=$('previewGrid'), empty=$('previewEmpty'); grid.innerHTML=''; if(!files.length){grid.hidden=true; empty.hidden=false; return;} empty.hidden=true; grid.hidden=false; files.forEach(file=>{const item=document.createElement('div'); item.className='preview-item'; const img=document.createElement('img'); img.alt=file.name; item.appendChild(img); const r=new FileReader(); r.onload=()=>img.src=r.result; r.readAsDataURL(file); grid.appendChild(item);}); }
$('postFiles').addEventListener('change',()=>setPreview(getFiles()));
async function signIn(){try{$('loginStatus').textContent='로그인 중…';await authPersistenceReady;const result=await signInWithPopup(auth,provider);if(!allowed(result.user.email)){await signOut(auth);throw new Error('허용되지 않은 계정입니다.');}firebaseIdToken=await result.user.getIdToken(true);$('loginStatus').textContent='';}catch(e){$('loginStatus').textContent=e.message||'로그인하지 못했습니다.';}}
$('loginBtn').onclick=signIn; $('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{if(user&&allowed(user.email)){try{firebaseIdToken=await user.getIdToken(true);}catch(e){await signOut(auth);$('loginStatus').textContent='로그인 토큰을 발급하지 못했습니다.';return;}$('loginPanel').hidden=true;$('adminPanel').hidden=false;$('userBox').hidden=false;$('userEmail').textContent=user.email;$('userPhoto').src=user.photoURL||'';loadPosts();}else{$('loginPanel').hidden=false;$('adminPanel').hidden=true;$('userBox').hidden=true;firebaseIdToken='';}});
async function api(payload){if(!endpoint())throw new Error('admin-config.js에 Apps Script 주소를 입력해 주세요.');const user=auth.currentUser;if(!user)throw new Error('로그인이 필요합니다.');firebaseIdToken=await user.getIdToken(true);const res=await fetch(endpoint(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,idToken:firebaseIdToken}),redirect:'follow'});if(!res.ok)throw new Error('네트워크 오류');const data=await res.json();if(!data.ok)throw new Error(data.error||'서버 오류');return data;}
async function listPublic(){const join=endpoint().includes('?')?'&':'?';const res=await fetch(`${endpoint()}${join}action=list&offset=0&limit=100`,{cache:'no-store',redirect:'follow'});const data=await res.json();if(!data.ok)throw new Error(data.error||'목록 오류');return data.posts||[];}
function gallery(post){ if(Array.isArray(post.gallery)&&post.gallery.length)return post.gallery; if(Array.isArray(post.imageUrls)&&post.imageUrls.length)return post.imageUrls.map(url=>({url})); if(post.imageUrl)return [{url:post.imageUrl}]; return []; }
function render(){const box=$('posts'); box.innerHTML=''; posts.forEach(p=>{const imgs=gallery(p); const imageUrl=imgs[0]?.url||''; const el=document.createElement('article'); el.className='post'; el.dataset.id=p.id; el.innerHTML=`${imageUrl?`<div class="post-media"><img src="${esc(imageUrl)}" alt=""></div>`:`<div class="post-media"></div>`}<div class="post-copy"><div class="post-date">${esc(fmtDate(p.date))}</div><div style="display:inline-block;margin:7px 0 6px;padding:4px 8px;background:#314fb7;color:#fff;font-size:10px;font-weight:800;text-transform:uppercase">${esc(p.category||'Events')}</div><h3>${esc(p.title||'소식')}</h3>${p.description?`<p>${esc(short(p.description))}</p>`:''}<div class="post-meta"><span class="post-count">사진 ${imgs.length||0}장</span><div class="post-actions"><button type="button" data-edit="${esc(p.id)}">수정</button><button type="button" data-delete="${esc(p.id)}">삭제</button></div></div></div>`; el.addEventListener('click',()=>openDetail(p.id)); box.appendChild(el);}); $('empty').hidden=posts.length>0; box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation();beginEdit(b.dataset.edit);}); box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=e=>{e.stopPropagation();removePost(b.dataset.delete);}); }
async function loadPosts(){try{$('empty').textContent='불러오는 중…'; posts=await listPublic(); render();}catch(e){$('empty').hidden=false;$('empty').textContent=e.message;}}
function resetForm(){ $('postForm').reset(); $('postId').value=''; setPreview([]); $('formHeading').textContent='새 소식 작성'; $('submitBtn').textContent='게시하기'; $('cancelEditBtn').hidden=true; $('formStatus').textContent=''; }
function beginEdit(id){ const p=posts.find(x=>String(x.id)===String(id)); if(!p)return; closeDetail(); $('postId').value=p.id; $('postCategory').value=p.category||'Events'; $('postTitle').value=p.title||''; $('postDate').value=fmtDate(p.date||''); $('postDescription').value=p.description||''; $('postFiles').value=''; const imgs=gallery(p); if(imgs.length){$('previewEmpty').hidden=true; $('previewGrid').hidden=false; $('previewGrid').innerHTML=imgs.map(img=>`<div class="preview-item"><img src="${esc(img.url)}" alt=""></div>`).join('');} else setPreview([]); $('formHeading').textContent='소식 수정'; $('submitBtn').textContent='수정 저장'; $('cancelEditBtn').hidden=false; scrollTo({top:0,behavior:'smooth'}); }
$('cancelEditBtn').onclick=resetForm;
function renderDetailSlide(){const p=posts.find(x=>String(x.id)===String(activePostId));if(!p)return;const imgs=gallery(p),box=$('detailGallery');if(!imgs.length){box.innerHTML='<div class="helper">등록된 사진이 없습니다.</div>';return;}detailSlideIndex=(detailSlideIndex+imgs.length)%imgs.length;box.innerHTML=`<div class="modal-slide active"><img src="${esc(imgs[detailSlideIndex].url)}" alt="${esc((p.title||'소식')+' '+(detailSlideIndex+1))}"></div>${imgs.length>1?'<button class="modal-arrow prev" type="button" aria-label="이전 사진">‹</button><button class="modal-arrow next" type="button" aria-label="다음 사진">›</button>':''}<span class="modal-counter">${detailSlideIndex+1} / ${imgs.length}</span>`;const prev=box.querySelector('.prev'),next=box.querySelector('.next');if(prev)prev.onclick=e=>{e.stopPropagation();detailSlideIndex--;renderDetailSlide();};if(next)next.onclick=e=>{e.stopPropagation();detailSlideIndex++;renderDetailSlide();};}
function openDetail(id){ const p=posts.find(x=>String(x.id)===String(id)); if(!p)return; activePostId=p.id; detailSlideIndex=0; $('detailTitle').textContent=p.title||'소식'; $('detailDate').textContent=fmtDate(p.date||''); $('detailDesc').textContent=p.description||''; renderDetailSlide(); $('detailModal').classList.add('open'); $('detailModal').setAttribute('aria-hidden','false'); }
function closeDetail(){ $('detailModal').classList.remove('open'); $('detailModal').setAttribute('aria-hidden','true'); activePostId=''; }
$('detailClose').onclick=closeDetail; $('detailModal').addEventListener('click',e=>{if(e.target=== $('detailModal')) closeDetail();}); $('detailEdit').onclick=()=>{if(activePostId)beginEdit(activePostId);}; $('detailDelete').onclick=()=>{if(activePostId)removePost(activePostId);};
function resizeOne(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onerror=()=>reject(new Error('파일을 읽지 못했습니다.'));r.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('이미지를 열지 못했습니다.'));img.onload=()=>{const max=800,s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d',{alpha:false});ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);const u=c.toDataURL('image/jpeg',.55);resolve({imageData:u.split(',')[1],mimeType:'image/jpeg',fileName:(file.name||'news').replace(/\.[^.]+$/,'')+'.jpg'});};img.src=r.result;};r.readAsDataURL(file);});}
async function resizeAll(files){const out=new Array(files.length);let done=0;const workers=Math.min(4,files.length);let cursor=0;async function worker(){while(cursor<files.length){const i=cursor++;out[i]=await resizeOne(files[i]);done++;$('formStatus').textContent=`사진 압축 중 ${done}/${files.length}장…`;}}await Promise.all(Array.from({length:workers},worker));return out;}
async function uploadInBatches(images){const uploaded=[];const batchSize=5;for(let i=0;i<images.length;i+=batchSize){const batch=images.slice(i,i+batchSize);$('formStatus').textContent=`사진 업로드 중 ${Math.min(i+batch.length,images.length)}/${images.length}장…`;const data=await api({action:'uploadBatch',images:batch});uploaded.push(...(data.gallery||[]));}return uploaded;}
$('postForm').onsubmit=async e=>{e.preventDefault();const id=$('postId').value.trim();const files=getFiles();if(files.length>30){$('formStatus').textContent='사진은 최대 30장까지만 업로드할 수 있습니다.';return;}if(!id&&!files.length){$('formStatus').textContent='새 게시물에는 사진을 1장 이상 선택해 주세요.';return;}const btn=$('submitBtn');btn.disabled=true;try{const payload={action:id?'update':'create',id,category:$('postCategory').value,title:$('postTitle').value.trim(),date:$('postDate').value,description:$('postDescription').value.trim()};if(files.length){$('formStatus').textContent=`사진 압축 준비 중…`;const compressed=await resizeAll(files);payload.gallery=await uploadInBatches(compressed);}$('formStatus').textContent='게시물 저장 중…';await api(payload);resetForm();await loadPosts();$('formStatus').textContent='저장되었습니다.';}catch(err){$('formStatus').textContent=err.message||'저장하지 못했습니다.';}finally{btn.disabled=false;}};
async function removePost(id){ const p=posts.find(x=>String(x.id)===String(id)); if(!confirm(`“${p?.title||'이 게시물'}”을 삭제할까요?`))return; try{ await api({action:'delete',id}); closeDetail(); resetForm(); await loadPosts(); }catch(e){ alert(e.message); } }
</script>
</body>
</html>
