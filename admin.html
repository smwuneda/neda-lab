<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEDA Lab News Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#14286f;--navy2:#081746;--ink:#20242a;--muted:#68707d;--line:#e1e6ef;--soft:#f5f7fb;--danger:#a82b2b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,sans-serif;color:var(--ink);background:var(--soft);line-height:1.6}
button,input,textarea{font:inherit}.top{background:var(--navy2);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-family:"Source Serif 4",serif;font-size:20px}.user{display:flex;align-items:center;gap:10px;font-size:12px}.user img{width:34px;height:34px;border-radius:50%}.user button,.login button{border:0;border-radius:999px;padding:9px 14px;font-weight:700;cursor:pointer}.user button{background:#fff;color:var(--navy2)}
.wrap{max-width:1120px;margin:34px auto;padding:0 20px}.login{max-width:520px;margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;text-align:center;box-shadow:0 18px 55px rgba(8,23,70,.10)}.login h1,.panel h2{font-family:"Source Serif 4",serif;color:var(--navy2)}.login h1{font-size:30px;margin:0 0 9px}.login p{color:var(--muted)}.login button{background:var(--navy);color:#fff;margin-top:10px;padding:12px 18px}
.grid{display:grid;grid-template-columns:380px 1fr;gap:24px;align-items:start}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 36px rgba(8,23,70,.06)}.panel h2{margin:0 0 18px;font-size:24px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;font-weight:700;color:var(--navy2)}.field input,.field textarea{width:100%;border:1px solid #d4dae6;border-radius:10px;padding:10px 11px;background:#fff}.field textarea{min-height:130px;resize:vertical}.preview{width:100%;aspect-ratio:16/10;background:#eef2f8;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;margin:8px 0 15px}.preview img{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:8px}.primary,.secondary,.danger{border:0;border-radius:999px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:#fff}.secondary{background:#edf0f6;color:var(--navy2)}.danger{background:#fff0f0;color:var(--danger)}button:disabled{opacity:.5;cursor:not-allowed}.status{font-size:12px;color:var(--muted);margin-top:12px;min-height:20px}
.posts{display:grid;gap:13px}.post{display:grid;grid-template-columns:150px 1fr;gap:15px;border:1px solid var(--line);border-radius:14px;overflow:hidden}.post-media{background:#eef2f8;min-height:118px}.post-media img{width:100%;height:100%;object-fit:cover}.post-copy{padding:14px 14px 14px 0}.post-copy h3{margin:0;color:var(--navy2);font-size:16px}.post-date{font-size:11px;color:var(--navy);font-weight:700}.post-copy p{font-size:12px;color:var(--muted);white-space:pre-line;margin:7px 0 10px}.post-actions{display:flex;gap:7px}.post-actions button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:44px 12px;border:1px dashed #ccd4e2;border-radius:14px}
[hidden]{display:none!important}@media(max-width:850px){.grid{grid-template-columns:1fr}.top{padding:14px 16px}.wrap{margin-top:22px}.post{grid-template-columns:110px 1fr}}
</style>
<script src="admin-config.js"></script>
</head>
<body>
<header class="top"><div class="brand">SMWU NEDA · News Admin</div><div class="user" id="userBox" hidden><img id="userPhoto" alt=""><span id="userEmail"></span><button id="logoutBtn">로그아웃</button></div></header>
<main class="wrap">
<section class="login" id="loginPanel"><h1>NEDA Lab 관리자</h1><p>허용된 Google 계정으로 로그인한 뒤 소식을 작성·수정·삭제할 수 있습니다.</p><button id="loginBtn">Google 계정으로 로그인</button><div class="status" id="loginStatus"></div></section>
<section class="grid" id="adminPanel" hidden>
<div class="panel"><h2 id="formHeading">새 소식 작성</h2><form id="postForm"><input id="postId" type="hidden"><input id="oldImageFileId" type="hidden"><div class="field"><label for="postFile">대표 사진</label><input id="postFile" type="file" accept="image/jpeg,image/png,image/webp"><div class="preview" id="preview">사진을 선택하세요</div></div><div class="field"><label for="postTitle">제목</label><input id="postTitle" maxlength="120" required></div><div class="field"><label for="postDate">날짜</label><input id="postDate" type="date"></div><div class="field"><label for="postDescription">내용</label><textarea id="postDescription" maxlength="2000"></textarea></div><div class="actions"><button class="primary" id="submitBtn" type="submit">게시하기</button><button class="secondary" id="cancelEditBtn" type="button" hidden>수정 취소</button></div><div class="status" id="formStatus"></div></form></div>
<div class="panel"><h2>게시된 소식</h2><div class="posts" id="posts"></div><div class="empty" id="empty">아직 게시된 소식이 없습니다.</div></div>
</section>
</main>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
const cfg=window.NEDA_ADMIN_CONFIG||{};
const app=initializeApp(cfg.firebase||{}); const auth=getAuth(app); const provider=new GoogleAuthProvider(); provider.setCustomParameters({prompt:'select_account'});
const $=id=>document.getElementById(id); let posts=[]; let firebaseIdToken='';
const endpoint=()=>String(cfg.appsScriptUrl||'').trim();
const allowed=email=>(cfg.allowedEmails||[]).map(v=>String(v).toLowerCase()).includes(String(email||'').toLowerCase());
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function signIn(){try{$('loginStatus').textContent='로그인 중…';const result=await signInWithPopup(auth,provider);if(!allowed(result.user.email)){await signOut(auth);throw new Error('허용되지 않은 계정입니다.');}firebaseIdToken=await result.user.getIdToken(true);$('loginStatus').textContent='';}catch(e){$('loginStatus').textContent=e.message||'로그인하지 못했습니다.';}}
$('loginBtn').onclick=signIn;$('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{if(user&&allowed(user.email)){try{firebaseIdToken=await user.getIdToken(true);}catch(e){await signOut(auth);$('loginStatus').textContent='로그인 토큰을 발급하지 못했습니다.';return;}$('loginPanel').hidden=true;$('adminPanel').hidden=false;$('userBox').hidden=false;$('userEmail').textContent=user.email;$('userPhoto').src=user.photoURL||'';loadPosts();}else{$('loginPanel').hidden=false;$('adminPanel').hidden=true;$('userBox').hidden=true;firebaseIdToken='';}});
async function api(payload){if(!endpoint())throw new Error('admin-config.js에 Apps Script 주소를 입력해 주세요.');const user=auth.currentUser;if(!user)throw new Error('로그인이 필요합니다.');firebaseIdToken=await user.getIdToken(true);const res=await fetch(endpoint(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,idToken:firebaseIdToken}),redirect:'follow'});if(!res.ok)throw new Error('네트워크 오류');const data=await res.json();if(!data.ok)throw new Error(data.error||'서버 오류');return data;}
async function listPublic(){const join=endpoint().includes('?')?'&':'?';const res=await fetch(`${endpoint()}${join}action=list&offset=0&limit=100`,{cache:'no-store',redirect:'follow'});const data=await res.json();if(!data.ok)throw new Error(data.error||'목록 오류');return data.posts||[];}
function render(){const box=$('posts');box.innerHTML='';posts.forEach(p=>{const el=document.createElement('article');el.className='post';el.innerHTML=`<div class="post-media">${p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="">`:''}</div><div class="post-copy"><span class="post-date">${esc(p.date||'')}</span><h3>${esc(p.title)}</h3><p>${esc(p.description||'')}</p><div class="post-actions"><button data-edit="${esc(p.id)}">수정</button><button data-delete="${esc(p.id)}">삭제</button></div></div>`;box.appendChild(el);});$('empty').hidden=posts.length>0;box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>beginEdit(b.dataset.edit));box.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>removePost(b.dataset.delete));}
async function loadPosts(){try{$('empty').textContent='불러오는 중…';posts=await listPublic();render();}catch(e){$('empty').hidden=false;$('empty').textContent=e.message;}}
function beginEdit(id){const p=posts.find(x=>String(x.id)===String(id));if(!p)return;$('postId').value=p.id;$('oldImageFileId').value=p.imageFileId||'';$('postTitle').value=p.title||'';$('postDate').value=p.date||'';$('postDescription').value=p.description||'';$('preview').innerHTML=p.imageUrl?`<img src="${esc(p.imageUrl)}" alt="">`:'사진 없음';$('formHeading').textContent='소식 수정';$('submitBtn').textContent='수정 저장';$('cancelEditBtn').hidden=false;scrollTo({top:0,behavior:'smooth'});}
function resetForm(){$('postForm').reset();$('postId').value='';$('oldImageFileId').value='';$('preview').textContent='사진을 선택하세요';$('formHeading').textContent='새 소식 작성';$('submitBtn').textContent='게시하기';$('cancelEditBtn').hidden=true;$('formStatus').textContent='';}
$('cancelEditBtn').onclick=resetForm;
$('postFile').onchange=e=>{const f=e.target.files?.[0];if(!f){return;}const r=new FileReader();r.onload=()=>{$('preview').innerHTML=`<img src="${r.result}" alt="미리보기">`;};r.readAsDataURL(f);};
function resize(file){return new Promise((resolve,reject)=>{if(!file){resolve({});return;}const r=new FileReader();r.onerror=()=>reject(new Error('파일을 읽지 못했습니다.'));r.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('이미지를 열지 못했습니다.'));img.onload=()=>{const max=1800,s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const u=c.toDataURL('image/jpeg',.84);resolve({imageData:u.split(',')[1],mimeType:'image/jpeg',fileName:(file.name||'news').replace(/\.[^.]+$/,'')+'.jpg'});};img.src=r.result;};r.readAsDataURL(file);});}
$('postForm').onsubmit=async e=>{e.preventDefault();const id=$('postId').value,file=$('postFile').files?.[0];if(!id&&!file){$('formStatus').textContent='새 게시물에는 대표 사진을 선택해 주세요.';return;}const btn=$('submitBtn');btn.disabled=true;$('formStatus').textContent='저장 중…';try{const image=await resize(file);await api({action:id?'update':'create',id,title:$('postTitle').value.trim(),date:$('postDate').value,description:$('postDescription').value.trim(),oldImageFileId:$('oldImageFileId').value,...image});resetForm();await loadPosts();$('formStatus').textContent='저장되었습니다.';}catch(err){$('formStatus').textContent=err.message;}finally{btn.disabled=false;}};
async function removePost(id){const p=posts.find(x=>String(x.id)===String(id));if(!confirm(`“${p?.title||'이 게시물'}”을 삭제할까요?`))return;try{await api({action:'delete',id});await loadPosts();}catch(e){alert(e.message);}}
</script>
</body></html>
